AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  # shop.rb is the demo's mock of every shape of choice the
  # report draws, written to be awkward rather than tidy;
  # demo/cards are the README's card examples, written to
  # show each kind of decision, eg ids.any? { |id| id.odd? } rather
  # than ids.any?(&:odd?), which is none.
  Exclude:
    - reports/**/*
    - demo/source/shop.rb
    - demo/cards/**/*

Layout/LineLength:
  Max: 70

# The tests run with RUBYOPT=--enable-frozen-string-literal
# (bin/run_tests.sh), so no literal is mutated; the gem
# then behaves the same whatever its consumer sets.
Style/FrozenStringLiteralComment:
  Enabled: false

# A case's pattern stand-in must match exactly as the case
# would, which is by ===.
Style/CaseEquality:
  Exclude:
    - lib/path_coverage/recorder.rb
    - lib/path_coverage/recorder_cases.rb

# fee.rb is the README's example, whose ifs keep their end, as
# a modifier if is no decision and so would draw no grid.
Style/IfUnlessModifier:
  Exclude:
    - demo/source/fee.rb
